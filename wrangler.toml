name = "cf-analytics-telemetry"
main = "src/index.ts"
compatibility_date = "2026-05-06"
compatibility_flags = ["nodejs_compat"]

[[analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "telemetry"

